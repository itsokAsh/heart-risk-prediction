services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: heartguard
      POSTGRES_PASSWORD: heartguard
      POSTGRES_DB: heartguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartguard -d heartguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
